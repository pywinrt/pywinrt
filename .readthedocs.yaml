# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Zensical
# https://docs.readthedocs.com/platform/stable/intro/zensical.html
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install -r docs/requirements.txt
    build:
      html:
        - zensical build --strict
    post_build:
      # Copy the built site into the directory Read the Docs publishes.
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive _site/* $READTHEDOCS_OUTPUT/html/
