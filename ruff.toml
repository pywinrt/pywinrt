# The lint job in .github/workflows/lint.yaml runs a bare `ruff check` and
# `ruff format --check` from the repository root, so what CI checks and what an
# editor checks are the same thing. Only the rules below are selected: the ones ruff enables by default
# are all about executed code, and the generated __init__.py binds the names it
# exports from the projection table at import time, which reads as fifteen
# hundred undefined names.
target-version = "py311"

# The generated stubs declare their type parameters with PEP 695 syntax, which
# ruff checks against the target version although a stub is never executed.
[per-file-target-version]
"projection/**/*.pyi" = "py312"

[lint]
select = [
    # pyupgrade: the 3.11 floor makes the legacy typing spellings unnecessary
    "UP",
    # flake8-pyi: the conventions that a type stub is read by
    "PYI",
]

[lint.per-file-ignores]
# The interop stubs are hand-written and are the only description the extension
# modules beside them have, so they keep their docstrings (PYI021) and name
# their default values rather than hiding them behind "..." (PYI011).
"interop/**/*.pyi" = ["PYI011", "PYI021"]

[format]
# A generated file is changed through its generator, never by a formatter run
# over it, so the formatter leaves alone everything under projection/ and the
# packaging that scripts/generate-pyproject.py writes. The code blocks in the
# Markdown pages are written to be read on the page, and are left alone too.
exclude = [
    "projection/**",
    "interop/*/setup.py",
    "redist/**/*.py",
    "runtime/setup.py",
    "table/winrt/table/version.py",
    "*.md",
]
