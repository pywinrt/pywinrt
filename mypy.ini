# The packages below are generated into projection/ and interop/ and the runtime
# keeps its own under runtime/python, so none of them is installed in the
# environment that runs mypy. The lint job in .github/workflows/test.yaml copies
# all three into _install/lint, which is what mypy_path points at.
[mypy]
mypy_path = _install/lint
packages = winrt, winui2, test_winrt, test

warn_redundant_casts = True
warn_unreachable = True

# hatchling is what builds a projection package, not what the runtime imports,
# so it is not in the environment that runs mypy.
[mypy-hatchling.*]
ignore_missing_imports = True
