# The packages below are generated into projection/, interop/ and redist/ and the
# runtime keeps its own under runtime/python, so none of them is installed in the
# environment that runs mypy. scripts/merge-packages.py, which the build and the
# lint job run, copies all four into _typing, which is what mypy_path points at.
[mypy]
mypy_path = _typing
packages = winrt, winui2, test_winrt, test
# the newest released Python, so that a check does not depend on which
# interpreter runs mypy. It is the only version type-checked: the test matrix
# runs the tests on every supported Python, but no type checker.
python_version = 3.14

warn_redundant_casts = True
warn_unreachable = True
warn_unused_ignores = True
# as under --strict, so that a stub naming what another module imports
# without exporting it is reported
implicit_reexport = False

# hatchling is what builds a projection package, not what the runtime imports,
# so it is not in the environment that runs mypy.
[mypy-hatchling.*]
ignore_missing_imports = True

# The tests are where a deprecated name is used on purpose, inside an
# assertWarns block, so that is where an unintended use is worth reporting.
[mypy-test.*]
enable_error_code = deprecated
