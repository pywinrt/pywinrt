# The packages below are generated into projection/, interop/ and redist/ and the
# runtime keeps its own under runtime/python, so none of them is installed in the
# environment that runs mypy. The lint job in .github/workflows/lint.yaml copies
# all four into _install/lint, which is what mypy_path points at.
[mypy]
mypy_path = _install/lint
packages = winrt, winui2, test_winrt, test
# the newest released Python, so that a check does not depend on which
# interpreter runs mypy; the oldest one is left to the test matrix
python_version = 3.14

warn_redundant_casts = True
warn_unreachable = True
warn_unused_ignores = True

# hatchling is what builds a projection package, not what the runtime imports,
# so it is not in the environment that runs mypy.
[mypy-hatchling.*]
ignore_missing_imports = True

# The tests are where a deprecated name is used on purpose, inside an
# assertWarns block, so that is where an unintended use is worth reporting.
[mypy-test.*]
enable_error_code = deprecated
