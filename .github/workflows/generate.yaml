name: generate
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - next
    paths:
      - .github/workflows/generate.yaml
      # what every package is versioned from
      - .config/_tools.json
      - projection/**
      - interop/**
      - runtime/**
      - table/**
      - PyWinRT/**
      - redist/**
      - scripts/app_sdk.py
      - scripts/fetch-tools.ps1
      - scripts/generate-cppwinrt.py
      - scripts/generate-pywinrt.py
      - scripts/generate-pyproject.py
      - scripts/nuget.py
      - scripts/packages.py
      - scripts/pyproject_templates.py
      - scripts/versions.py
  pull_request:
    paths:
      - .github/workflows/generate.yaml
      # what every package is versioned from
      - .config/_tools.json
      - projection/**
      - interop/**
      - runtime/**
      - table/**
      - PyWinRT/**
      - redist/**
      - scripts/app_sdk.py
      - scripts/fetch-tools.ps1
      - scripts/generate-cppwinrt.py
      - scripts/generate-pywinrt.py
      - scripts/generate-pyproject.py
      - scripts/nuget.py
      - scripts/packages.py
      - scripts/pyproject_templates.py
      - scripts/versions.py

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dotnet build PyWinRT -c Release
      - run: ./scripts/fetch-tools.ps1
      - run: python3 ./scripts/generate-cppwinrt.py
      - run: python3 ./scripts/generate-pywinrt.py
      - run: python3 ./scripts/generate-pyproject.py
      # fail if there are changes
      - run: git diff --exit-code
