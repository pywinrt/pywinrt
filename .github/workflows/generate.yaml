name: generate
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - next
    paths:
      - .github/workflows/generate.yaml
      # what every package is versioned from
      - .config/_tools.json
      - projection/**
      - interop/**
      - runtime/**
      - table/**
      - PyWinRT/**
      - redist/**
      - scripts/app_sdk.py
      - scripts/fetch-tools.ps1
      - scripts/generate-cppwinrt.py
      - scripts/generate-pywinrt.py
      - scripts/generate-pyproject.py
      - scripts/nuget.py
      - scripts/packages.py
      - scripts/pyproject_templates.py
      - scripts/versions.py
  pull_request:
    paths:
      - .github/workflows/generate.yaml
      # what every package is versioned from
      - .config/_tools.json
      - projection/**
      - interop/**
      - runtime/**
      - table/**
      - PyWinRT/**
      - redist/**
      - scripts/app_sdk.py
      - scripts/fetch-tools.ps1
      - scripts/generate-cppwinrt.py
      - scripts/generate-pywinrt.py
      - scripts/generate-pyproject.py
      - scripts/nuget.py
      - scripts/packages.py
      - scripts/pyproject_templates.py
      - scripts/versions.py

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dotnet build PyWinRT -c Release
      - run: ./scripts/fetch-tools.ps1
      - run: python3 ./scripts/generate-cppwinrt.py
      - run: python3 ./scripts/generate-pywinrt.py
      - run: python3 ./scripts/generate-pyproject.py
      # A run that projects only part of a package writes the rest of its
      # nullability file back as it read it, which the full runs above never
      # do. This one projects nothing, so all of it must come back unchanged.
      - run: |
          $tools = Get-Content .config/_tools.json | ConvertFrom-Json
          $winmd = "_tools/PyWinRT.TestWinRT.$($tools.'PyWinRT.TestWinRT')/lib/uap10.0/TestComponent.winmd"
          $sdk = python3 -c "import sys; sys.path.insert(0, 'scripts'); import versions; print(versions.windows_sdk_metadata_path())"
          ./PyWinRT/bin/Release/net10.0/PyWinRT.exe --input "test-winrt;$winmd" --reference "winrt;$sdk" --output "$env:RUNNER_TEMP/partial" --nullability-json nullability/test-winrt.json --component-dlls --include NoSuchNamespace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A misspelled fact is refused, where writing the file back would drop it.
          $json = [regex]::new('"kind": "in"').Replace((Get-Content nullability/test-winrt.json -Raw), '"kind": "in", "maybenul": true', 1)
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/misspelled.json", $json)
          $out = (./PyWinRT/bin/Release/net10.0/PyWinRT.exe --input "test-winrt;$winmd" --reference "winrt;$sdk" --output "$env:RUNNER_TEMP/misspelled" --nullability-json "$env:RUNNER_TEMP/misspelled.json" --component-dlls --include NoSuchNamespace 2>&1) -join "`n"
          if (!$LASTEXITCODE) { throw "a misspelled fact was not refused" }
          if ($out -notmatch "Unknown property maybenul in a parameter of \S+ \S+::\S+\(.*\), in namespace TestComponent of .+misspelled\.json") { $out; throw "a misspelled fact was refused for another reason" }
          exit 0
      # fail if a generator changed a committed file
      - run: git diff --exit-code
      # or wrote one that is not committed, which git diff does not see
      - run: |
          $untracked = git ls-files --others --exclude-standard
          if ($untracked) {
            $untracked
            throw "the generators wrote files that are not committed"
          }
