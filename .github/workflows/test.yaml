name: test
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - next
    paths:
      - .github/workflows/test.yaml
      - CMakeLists.txt
      - cmake/**
      - requirements.txt
      - .config/_tools.json
      - patches/**
      - scripts/fetch-tools.ps1
      # what fetch-tools.ps1 runs to fetch the App SDK
      - scripts/app_sdk.py
      - scripts/nuget.py
      # the version scheme, whose tests are part of the suite
      - scripts/versions.py
      - scripts/tests/**
      - projection/**
      - '!projection/**/*.md'
      - '!projection/**/*.toml'
      - '!projection/**/*.txt'
      # except a namespace's table, which is what the tests read
      - projection/**/_table.pywinrt.txt
      - projection/CMakeLists.txt
      - interop/**
      - '!interop/**/*.md'
      - '!interop/**/*.toml'
      - '!interop/**/*.txt'
      - '!interop/**/setup.py'
      - interop/CMakeLists.txt
      - runtime/**
      - '!runtime/**/*.md'
      - '!runtime/**/*.toml'
      - '!runtime/**/*.txt'
      - runtime/CMakeLists.txt
      # except the version the runtime is published with, which the
      # version tests read
      - runtime/version.txt
      - '!runtime/setup.py'
      - table/**
      - '!table/**/*.md'
      - '!table/**/*.toml'
      - '!table/winrt/table/build_hooks.py'
      - test/**
  pull_request:
    paths:
      - .github/workflows/test.yaml
      - CMakeLists.txt
      - cmake/**
      - requirements.txt
      - .config/_tools.json
      - patches/**
      - scripts/fetch-tools.ps1
      # what fetch-tools.ps1 runs to fetch the App SDK
      - scripts/app_sdk.py
      - scripts/nuget.py
      # the version scheme, whose tests are part of the suite
      - scripts/versions.py
      - scripts/tests/**
      - projection/**
      - '!projection/**/*.md'
      - '!projection/**/*.toml'
      - '!projection/**/*.txt'
      # except a namespace's table, which is what the tests read
      - projection/**/_table.pywinrt.txt
      - projection/CMakeLists.txt
      - interop/**
      - '!interop/**/*.md'
      - '!interop/**/*.toml'
      - '!interop/**/*.txt'
      - '!interop/**/setup.py'
      - interop/CMakeLists.txt
      - runtime/**
      - '!runtime/**/*.md'
      - '!runtime/**/*.toml'
      - '!runtime/**/*.txt'
      - runtime/CMakeLists.txt
      # except the version the runtime is published with, which the
      # version tests read
      - runtime/version.txt
      - '!runtime/setup.py'
      - table/**
      - '!table/**/*.md'
      - '!table/**/*.toml'
      - '!table/winrt/table/build_hooks.py'
      - test/**

jobs:
  msvc:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        architecture: ['x86', 'x64', 'arm64']
        release-type: ['Release'] # no "Debug" - https://github.com/actions/setup-python/issues/86
        include:
          - architecture: 'x86'
            vs-arch: 'Win32'
            runs-on: windows-2025-vs2026
          - architecture: 'x64'
            vs-arch: 'x64'
            runs-on: windows-2025-vs2026
          - architecture: 'arm64'
            vs-arch: 'ARM64'
            runs-on: windows-11-vs2026-arm
    name: Python ${{ matrix.python-version }} ${{ matrix.architecture }} ${{ matrix.release-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -r requirements.txt
      # XAML islands refuse to start unless the application manifest declares
      # maxversiontested, and the manifest in the interpreter that setup-python
      # installs does not. Without this, test_xaml_host skips.
      - name: declare maxversiontested in the interpreter's manifest
        run: ./scripts/fix_python_manifest_for_xaml_islands.ps1 (Get-Command python).Source
      - name: install nuget packages
        run: ./scripts/fetch-tools.ps1 -noMicrosoftUiXaml
      - name: configure
        run: cmake -S . -B _build/projection -A ${{ matrix.vs-arch }}
      - name: build
        run: cmake --build _build/projection --config ${{ matrix.release-type }} --parallel --verbose
      - name: install
        run: cmake --install _build/projection --prefix _install/projection
      - name: test
        env:
          PYTHONPATH: _install/projection
        run: python -X dev -m unittest -v
  mingw:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sys:
          - mingw64
          - ucrt64
          - clang64
    name: 'Building on MSYS ${{ matrix.sys }}'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{matrix.sys}}
          update: true
          pacboy: >-
            cc:p
            cmake:p
            python:p
            python-packaging:p
            python-typing_extensions:p
      - name: install nuget packages
        shell: pwsh
        run: ./scripts/fetch-tools.ps1 -noMicrosoftUiXaml
      - name: configure
        run: ${MINGW_PREFIX}/bin/cmake -S . -B _build/projection -DPython3_ROOT_DIR=${MINGW_PREFIX}
      - name: build
        run: ${MINGW_PREFIX}/bin/cmake --build _build/projection --verbose
      - name: install
        run: ${MINGW_PREFIX}/bin/cmake --install _build/projection --prefix _install/projection
      - name: test
        env:
          PYTHONPATH: _install/projection
        run: ${MINGW_PREFIX}/bin/python -X dev -m unittest -v
