name: lint
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - next
    paths:
      - .github/workflows/lint.yaml
      - mypy.ini
      - ruff.toml
      - '**/*.py'
      - '**/*.pyi'
  pull_request:
    paths:
      - .github/workflows/lint.yaml
      - mypy.ini
      - ruff.toml
      - '**/*.py'
      - '**/*.pyi'

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the rules and the files they apply to are in ruff.toml, so that the
      # editor checks the same thing as CI does
      - name: Run ruff
        run: pipx run ruff check
      - name: merge packages
        run: |
          mkdir _install/lint -Force
          # the runtime, the table compiler and the interop packages live
          # outside of projection/, so winrt.system, winrt.runtime and
          # winrt._winrt come from runtime/python and winrt.table from table/
          Get-ChildItem -Path projection/*/*, interop/*, redist/*, runtime/python, table -Directory -Recurse | Where-Object Name -IN "winrt", "winui2", "test_winrt" | ForEach-Object { Copy-Item -Path $_.FullName -Filter "*.py*" -Destination _install/lint/ -Recurse -Force  }
      # the packages and the path to them are in mypy.ini, so that the
      # editor checks the same thing as CI does
      - name: Run mypy
        run: pipx run mypy
