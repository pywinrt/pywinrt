name: lint
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - next
    paths:
      - .github/workflows/lint.yaml
      - mypy.ini
      - ruff.toml
      - pyrightconfig.json
      - pyrightconfig.lint.json
      - samples/requirements-dev.txt
      - '**/*.py'
      - '**/*.pyi'
  pull_request:
    paths:
      - .github/workflows/lint.yaml
      - mypy.ini
      - ruff.toml
      - pyrightconfig.json
      - pyrightconfig.lint.json
      - samples/requirements-dev.txt
      - '**/*.py'
      - '**/*.pyi'

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the rules and the files they apply to are in ruff.toml, so that the
      # editor checks the same thing as CI does
      - name: Run ruff
        run: pipx run ruff check
      - name: Check formatting
        run: pipx run ruff format --check
      - name: merge packages
        run: |
          mkdir _install/lint -Force
          # Only the stubs of a projection package: its __init__.py binds the
          # names it exports from the projection table at import time, which
          # a type checker cannot follow, and the stub beside it is what both
          # checkers read. So every .py here is code rather than glue.
          Get-ChildItem -Path projection/*/* -Directory -Recurse | Where-Object Name -IN "winrt", "winui2", "test_winrt" | ForEach-Object { Copy-Item -Path $_.FullName -Filter "*.pyi" -Destination _install/lint/ -Recurse -Force  }
          # the runtime, the table compiler and the interop packages live
          # outside of projection/, so winrt.system, winrt.runtime and
          # winrt._winrt come from runtime/python and winrt.table from table/
          Get-ChildItem -Path interop/*, redist/*, runtime/python, table -Directory -Recurse | Where-Object Name -IN "winrt", "winui2", "test_winrt" | ForEach-Object { Copy-Item -Path $_.FullName -Filter "*.py*" -Destination _install/lint/ -Recurse -Force  }
      # the packages and the path to them are in mypy.ini, so that the
      # editor checks the same thing as CI does
      - name: Run mypy
        run: pipx run mypy
      # what the checked code imports besides winrt, so that pyright resolves
      # it: the samples' dependencies, and the build backends that the build
      # hook and the generated setup.py files extend
      - name: Install what the checked code imports
        run: |
          python -m venv _install/pyright-venv
          _install/pyright-venv/Scripts/python -m pip install -r samples/requirements-dev.txt hatchling setuptools
      # the settings are in pyrightconfig.json, which the editor reads too; the
      # directories listed are the ones that are clean in strict mode so far
      - name: Run pyright
        run: pipx run pyright --pythonpath _install/pyright-venv/Scripts/python.exe test samples runtime table interop
      # the projection and interop packages merged as installed, which
      # pyrightconfig.lint.json says how to check
      - name: Run pyright over the merged packages
        run: pipx run pyright -p pyrightconfig.lint.json --pythonpath _install/pyright-venv/Scripts/python.exe
