version: 2
updates:
  # The workflows pin every action to a commit SHA, with the version in a
  # trailing comment. That makes a run reproducible, but it also freezes the
  # pins, so something has to unfreeze them: dependabot bumps the SHA and
  # rewrites the comment to match.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # one pull request a month for all of them, rather than one per action
    groups:
      actions:
        patterns:
          - "*"
    # a release is proposed once it has been out for two weeks, so that a bad
    # one has been noticed first; security updates are not held back
    cooldown:
      default-days: 14
  # A new release of the upstream package a family of generated packages is
  # generated from, proposed as soon as it is out, one pull request per
  # family.
  - package-ecosystem: nuget
    directory: /.config/upstream
    schedule:
      interval: weekly
  # The build tools that the release workflows and Read the Docs install are
  # pinned too, so that a release is built with what was tested, and a monthly
  # pull request of their own unfreezes them.
  - package-ecosystem: pip
    directories:
      - /
      - /docs
    # Dependabot reads the requirements.txt files below these directories as
    # well, and those are what the published packages require: the runtime's
    # floors are written by hand, and the interop packages' by
    # scripts/generate-pyproject.py. Version updates leave them alone;
    # security updates do not read this list, so they still reach them.
    exclude-paths:
      - "runtime/**"
      - "interop/**"
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns:
          - "*"
    cooldown:
      default-days: 14
