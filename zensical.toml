# Configuration file for the Zensical documentation builder.
# https://zensical.org/docs/setup/basics/

[project]
site_name = "PyWinRT"
# Zensical does not interpolate variables, so this cannot come from
# READTHEDOCS_CANONICAL_URL.
site_url = "https://pywinrt.readthedocs.io/en/latest/"
copyright = "Copyright &copy; 2022-2026, David Lechner"
repo_url = "https://github.com/pywinrt/pywinrt"
docs_dir = "docs"
site_dir = "_site"
extra_css = ["stylesheets/extra.css"]
nav = [
  "index.md",
  "types.md",
  { "API reference" = [
    "api/index.md",
    "api/runtime.md",
    "api/runtime.interop.md",
    "api/system.md",
    "api/system.hresult.md",
    { "winrt.windows namespace" = [
      "api/windows.md",
      "api/windows/graphics/capture/interop.md",
      "api/windows/graphics/directx/direct3d11/interop.md",
      "api/windows/media/interop.md",
      "api/windows/system/interop.md",
      "api/windows/ui/composition/interop.md",
    ] },
    { "winrt.microsoft namespace" = [
      "api/microsoft.md",
      "api/microsoft/ui/interop.md",
      "api/microsoft/windows/applicationmodel/dynamicdependency/bootstrap.md",
    ] },
  ] },
  "versioning.md",
  "freezing.md",
]

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "content.code.copy",
  "content.footnote.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
